plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace 'ir.hanzodev1375.filetreelib.vectormaster'
    compileSdk 36

    defaultConfig {
        minSdk 26
        targetSdk 36
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.androidx.appcompat
    implementation project(':thememanager')
}
